<div class="home-container">
  <div class="overlay">
    <h1>Bienvenido</h1>
    <button mat-raised-button color="accent" class="modern-btn" 
            [class.animate-text]="animateButton"
            (click)="initSession()">
        Ingresar
    </button>

    <div *ngIf="info">
        <h2>Información principal:</h2>
        <pre>{{ info | json }}</pre>
    </div>

  </div>
</div>
