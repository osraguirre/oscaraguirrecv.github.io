<div class="home-container">
  <header class="top-separator">
    <a class="brand-name" href="#">
      {{ (profile?.name || 'Oscar') + ' ' + (profile?.lastName || 'Aguirre') }}
    </a>

    <nav class="top-actions" aria-label="Navegación principal">
      <ul class="nav-list">
        <li><a class="nav-link" href="#about">Sobre mí</a></li>
        <li><a class="nav-link" href="#projects">Proyectos</a></li>
        <li><a class="nav-link" href="#contact">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <div class="content-area">
    <div class="profile-card">
      <div class="profile-photo-circle" aria-label="Espacio para foto de perfil">
        <span>Tu foto</span>
      </div>

      <div class="profile-identity">
        <p class="profile-name">
          {{ (profile?.name || 'Oscar') + ' ' + (profile?.lastName || 'Aguirre') }}
        </p>
        <p class="profile-role">{{ profile?.role || 'Desarrollador BackEnd' }}</p>
        <p class="profile-location">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="currentColor"
          >
            <path
              d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 7.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"
            />
          </svg>
          <span>{{ profile?.location || 'Nuevo Leon., Mexico' }}</span>
        </p>
      </div>

      <ul class="profile-social-list" aria-label="Redes de contacto">
        <li>
          <a
            class="social-link"
            [href]="contactInfo?.github || 'https://github.com/osraguirre'"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
            [attr.data-tooltip]="contactInfo?.github || 'github.com/osraguirre'"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2C6.48 2 2 6.59 2 12.26c0 4.53 2.87 8.36 6.84 9.72.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.38-3.37-1.38-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .08 1.53 1.05 1.53 1.05.89 1.58 2.34 1.12 2.91.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.15-4.56-5.1 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.74 0 0 .84-.28 2.75 1.05a9.34 9.34 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.43.2 2.48.1 2.74.64.72 1.03 1.64 1.03 2.76 0 3.96-2.34 4.83-4.57 5.09.36.32.68.95.68 1.92 0 1.38-.01 2.49-.01 2.83 0 .27.18.6.69.49A10.29 10.29 0 0 0 22 12.26C22 6.59 17.52 2 12 2z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a
            class="social-link"
            [href]="'mailto:' + (contactInfo?.email || 'osr122g@gmail.com')"
            aria-label="Gmail"
            title="Gmail"
            [attr.data-tooltip]="contactInfo?.email || 'osr122g@gmail.com'"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-.4 2L12 11.25 4.4 6h15.2zM4 18V7.24l7.43 5.12a1 1 0 0 0 1.14 0L20 7.24V18H4z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a
            class="social-link"
            [href]="contactInfo?.linkedin || 'https://www.linkedin.com/in/oscar-alberto-aguirre-gamboa/'"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            title="LinkedIn"
            [attr.data-tooltip]="contactInfo?.linkedin || 'linkedin.com/in/oscar-alberto-aguirre-gamboa'"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.94 8.5a1.73 1.73 0 1 1 0-3.46 1.73 1.73 0 0 1 0 3.46zM5.4 9.9h3.1V19H5.4V9.9zm5.25 0h2.97v1.24h.04c.41-.78 1.42-1.6 2.93-1.6 3.13 0 3.7 2.1 3.7 4.84V19h-3.1v-4.1c0-.98-.02-2.24-1.33-2.24-1.33 0-1.53 1.06-1.53 2.16V19h-3.1V9.9z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a
            class="social-link"
            [href]="'tel:' + (contactInfo?.phoneNumber || '+528181789173')"
            aria-label="Teléfono"
            title="Teléfono"
            [attr.data-tooltip]="contactInfo?.phoneNumber || '+52 81 8178 9173'"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1-.24c1.1.36 2.28.56 3.49.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C11.3 21 3 12.7 3 2.1a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.21.2 2.39.56 3.49a1 1 0 0 1-.24 1l-2.2 2.2z"
              />
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
